<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Movie Theater{% endblock %}</title>
    <!-- Bootstrap for styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1>Movie Theater Booking</h1>
        <a href="{% url 'movie_list' %}">Home</a> |
        <a href="{% url 'booking_history' %}">My Bookings</a>
        {% if user.is_authenticated %} Logged in as {{ user.username }} | <a href="{% url 'logout' %}">Logout</a> {% else %}
    <a href="{% url 'login' %}">Login</a>
{% endif %}
	<hr>
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
